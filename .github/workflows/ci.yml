name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_api.py and test_bookings.py create their own tempfile DB;
      # no extra setup is needed for those two.
      - name: Run test_api.py
        run: python test_api.py

      - name: Run test_bookings.py
        run: python test_bookings.py

      # test_db.py reads DEFAULT_DB_PATH (defaults to ./airbnb.db).
      # Seed a fresh temporary database and point DATABASE_PATH at it
      # so CI never touches any production file.
      - name: Seed isolated database for test_db.py
        run: |
          DB_PATH="$(mktemp --suffix=.db)"
          echo "DATABASE_PATH=$DB_PATH" >> "$GITHUB_ENV"
          DATABASE_PATH="$DB_PATH" python - <<'PYEOF'
          import os
          from database import create_tables, get_connection
          import seed

          db_path = os.environ["DATABASE_PATH"]
          conn = get_connection(db_path)
          create_tables(conn)
          seed.populate_seed_data(conn)
          conn.close()
          print(f"Seeded test database: {db_path}")
          PYEOF

      - name: Run test_db.py
        run: python test_db.py

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Checks (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        run: npm run build
        env:
          # Provide a placeholder so the build does not warn about a
          # missing NEXT_PUBLIC_API_URL; the real value is only needed
          # at runtime, not compile time.
          NEXT_PUBLIC_API_URL: https://example.com
